<!DOCTYPE html>
<html>
  <head>
    <title>AR Screamer</title>
    <!-- Importamos A-Frame y AR.js -->
    <script src="https://aframe.io/releases/1.2.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar.js"></script>
    
    <!-- Componente para reproducir y pausar el video al detectar el marcador -->
    <script>
      AFRAME.registerComponent('vidhandler', {
        init: function () {
          this.toggle = false;
          this.vid = document.querySelector("#screamer-vid");
          this.vid.pause();
        },
        tick: function () {
          if (this.el.object3D.visible == true) {
            if (!this.toggle) {
              this.toggle = true;
              this.vid.play();
            }
          } else {
            if (this.toggle) {
              this.toggle = false;
              this.vid.pause();
            }
          }
        }
      });
    </script>
  </head>
  <body style="margin: 0; overflow: hidden;">
    <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false; trackingMethod: best;">
      <a-assets>
        <!-- Cargamos el video local -->
        <video id="screamer-vid" src="Screamer.mp4" preload="auto" response-type="arraybuffer" loop crossorigin webkit-playsinline playsinline></video>
      </a-assets>

      <!-- Configuramos el marcador personalizado -->
      <a-marker type="pattern" url="pattern-muertos.patt" vidhandler>
        <!-- Ajustamos el tamaño y rotación del video sobre el marcador -->
        <a-video src="#screamer-vid" position="0 0.1 0" rotation="-90 0 0" width="2" height="1.5"></a-video>
      </a-marker>

      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
